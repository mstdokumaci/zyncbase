<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#101b28" />
	<title>Cordon Off: free multiplayer territory game</title>
	<meta name="description"
		content="Surround land to claim it. The biggest empire at the buzzer wins. Free multiplayer territory game in your browser, with a new round every 2 hours." />
	<link rel="canonical" href="https://game.ulkeler.com/" />
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Cordon Off" />
	<meta property="og:title" content="Cordon Off: claim the map" />
	<meta property="og:description"
		content="Surround land to claim it. The biggest empire at the buzzer wins. Free multiplayer territory game in your browser, with a new round every 2 hours." />
	<meta property="og:url" content="https://game.ulkeler.com/" />
	<meta property="og:image" content="https://game.ulkeler.com/og.png" />
	<meta property="og:image:width" content="2000" />
	<meta property="og:image:height" content="1000" />
	<meta property="og:image:alt"
		content="Pixel-art world map from Cordon Off, a multiplayer territory game" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="Cordon Off: claim the map" />
	<meta name="twitter:description"
		content="Surround land to claim it. The biggest empire at the buzzer wins. Free multiplayer territory game in your browser, with a new round every 2 hours." />
	<meta name="twitter:image" content="https://game.ulkeler.com/og.png" />
	<meta name="twitter:image:alt"
		content="Pixel-art world map from Cordon Off, a multiplayer territory game" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "VideoGame",
			"name": "Cordon Off",
			"url": "https://game.ulkeler.com/",
			"description": "Surround land to claim it. The biggest empire at the buzzer wins. Free multiplayer territory game in your browser, with a new round every 2 hours.",
			"image": "https://game.ulkeler.com/og.png",
			"genre": "Strategy",
			"playMode": "MultiPlayer",
			"applicationCategory": "Game",
			"operatingSystem": "Web browser",
			"inLanguage": "en",
			"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
		}
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="/style.css" />
	<script type="module" src="/client.js"></script>
</head>

<body>
	<canvas id="map" tabindex="-1"
		aria-label="Live territory map. Your territory is shown in the status panel."></canvas>
	<div class="hud">
		<span class="round" id="round" hidden></span>
		<span class="connection" id="connection" role="status"></span>
	</div>
	<main id="lobby">
		<div class="lobby-top">
			<a class="brand" href="/" aria-label="Cordon Off home"><span class="mark" aria-hidden="true"></span><span
					class="brand-text">Cordon <strong>Off</strong></span></a>
			<a class="nav" href="/history.html">Past rounds</a>
		</div>
		<section class="welcome">
			<p class="eyebrow">MOVE · SURROUND · CLAIM</p>
			<h1>Claim the <em>map.</em></h1>
			<p class="intro">Surround land to claim it. Biggest empire at the buzzer wins. New round every 2 hours.</p>
			<form id="join">
				<div class="field">
					<label for="country-choice">Your country</label>
					<select id="country-choice" name="country-choice" required disabled
						aria-describedby="country-slots">
						<option value="">Loading countries…</option>
					</select>
				</div>
				<p id="country-slots" class="small" role="status"></p>
				<div id="country-preview" hidden><span id="country-swatch" class="swatch"
						aria-hidden="true"></span><span id="country-detail" class="small"></span></div>
				<div id="new-country" hidden>
					<label for="country">New country name</label>
					<input id="country" name="country" placeholder="Name your country" disabled maxlength="24"
						autocomplete="off" />
				</div>
				<div class="field">
					<label for="player-name">Your name <span class="small">· up to 16 characters</span></label>
					<input id="player-name" name="player-name" placeholder="How others see you" required maxlength="16"
						autocomplete="nickname" />
				</div>
				<button class="primary" id="join-button" type="submit" disabled>Deploy ▶</button>
				<p id="error" class="error" role="alert"></p>
			</form>
		</section>
	</main>
	<aside id="scoreboard" class="panel" hidden>
		<h2>
			<button id="scoreboard-toggle" type="button" aria-expanded="true" aria-controls="countries">
				<span>Countries <span id="country-count">0</span></span>
				<span class="chevron" aria-hidden="true">▾</span>
			</button>
		</h2>
		<ol id="countries"></ol>
	</aside>
	<nav class="joystick" id="joystick" aria-label="Movement joystick" hidden></nav>
	<div class="controls-hint" id="controls-hint" aria-hidden="true">
		<span class="keys keys-move"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
		<span class="keys keys-arrows"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span>
		<span class="zoom-hint">SCROLL TO ZOOM</span>
	</div>
</body>

</html>
