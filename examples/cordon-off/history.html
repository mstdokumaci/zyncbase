<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#101b28" />
	<title>Past rounds · Cordon Off</title>
	<meta name="description"
		content="Final standings and maps from every finished Cordon Off round. New rounds end every 2 hours." />
	<link rel="canonical" href="https://game.ulkeler.com/history.html" />
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Cordon Off" />
	<meta property="og:title" content="Cordon Off: past rounds" />
	<meta property="og:description"
		content="Final standings and maps from every finished Cordon Off round. New rounds end every 2 hours." />
	<meta property="og:url" content="https://game.ulkeler.com/history.html" />
	<meta property="og:image" content="https://game.ulkeler.com/og.png" />
	<meta property="og:image:width" content="2000" />
	<meta property="og:image:height" content="1000" />
	<meta property="og:image:alt"
		content="Pixel-art world map from Cordon Off, a multiplayer territory game" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="Cordon Off: past rounds" />
	<meta name="twitter:description"
		content="Final standings and maps from every finished Cordon Off round. New rounds end every 2 hours." />
	<meta name="twitter:image" content="https://game.ulkeler.com/og.png" />
	<meta name="twitter:image:alt"
		content="Pixel-art world map from Cordon Off, a multiplayer territory game" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="/style.css" />
	<style>
		:root {
			scrollbar-gutter: stable;
		}

		body {
			background: var(--bg-deep);
			color: var(--dim);
			font: 14px/1.55 var(--font-body);
		}

		header {
			position: sticky;
			top: 0;
			z-index: 2;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			padding: 12px clamp(18px, 6vw, 56px);
			background: #0d1822f2;
			border-bottom: 2px solid #1c2c3d;
		}

		main {
			max-width: 980px;
			margin: 0 auto;
			padding: clamp(20px, 4vh, 40px) clamp(18px, 6vw, 42px) 80px;
		}

		h1 {
			font-family: var(--font-pixel);
			font-size: clamp(24px, 4vw, 32px);
			font-weight: 400;
			letter-spacing: 0;
			margin: 0 0 6px;
			color: #eef4f4;
		}

		h2 {
			font-size: 18px;
			margin: 0;
		}

		.status {
			color: var(--muted);
		}

		.eyebrow {
			font-family: var(--font-pixel);
			font-size: 10px;
			letter-spacing: 2px;
			color: var(--gold);
			text-transform: uppercase;
			margin: 0 0 8px;
		}

		.winner {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 12px;
			margin: 20px 0 26px;
			padding: 18px;
			border: 2px solid var(--gold);
			background: #101b28cc;
			box-shadow: var(--hard-shadow);
		}

		.winner .name {
			font-family: var(--font-pixel);
			font-size: 20px;
			color: var(--gold-bright);
		}

		.meta {
			color: var(--muted);
			font-size: 12px;
		}

		.swatch {
			display: inline-block;
			width: 14px;
			height: 14px;
			border: 1px solid #ffffff60;
			vertical-align: -2px;
			margin-right: 8px;
		}

		.map {
			display: block;
			width: 100%;
			height: auto;
			image-rendering: pixelated;
			border: 2px solid #1c2c3d;
			background: #131f2c;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 26px;
		}

		th,
		td {
			text-align: left;
			padding: 9px 10px;
			border-bottom: 1px solid #9eb4bd1a;
		}

		th {
			font-family: var(--font-pixel);
			font-size: 10px;
			font-weight: 400;
			letter-spacing: 1px;
			text-transform: uppercase;
			color: var(--muted);
		}

		td.score {
			text-align: right;
			font-variant-numeric: tabular-nums;
		}

		tr:nth-child(2) {
			background: #f1cb7c12;
		}

		tr:nth-child(2) .score {
			color: var(--gold-bright);
		}

		.bot {
			color: var(--muted);
			font-size: 10px;
			font-family: var(--font-pixel);
			margin-left: 6px;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
			gap: 16px;
			margin-top: 22px;
		}

		.card {
			display: block;
			color: inherit;
			text-decoration: none;
			border: 2px solid #1c2c3d;
			background: #101b28cc;
			box-shadow: var(--hard-shadow);
			transition: translate .12s, border-color .12s;
		}

		.card:hover {
			border-color: var(--gold);
			translate: -2px -2px;
		}

		.card img {
			display: block;
			width: 100%;
			height: auto;
			aspect-ratio: 2 / 1;
			object-fit: cover;
			image-rendering: pixelated;
			background: #131f2c;
			border-bottom: 2px solid #1c2c3d;
		}

		.card .body {
			padding: 12px;
		}

		.card .title {
			font-family: var(--font-pixel);
			font-size: 14px;
			color: #eef4f4;
		}

		.card .line {
			font-size: 12px;
			margin-top: 3px;
		}

		.actions {
			margin-top: 30px;
			display: flex;
			gap: 12px;
			flex-wrap: wrap;
		}

		.button {
			display: inline-block;
			color: #172431;
			background: var(--gold);
			text-decoration: none;
			font-family: var(--font-pixel);
			font-size: 12px;
			letter-spacing: 1px;
			text-transform: uppercase;
			padding: 12px 18px;
			border: 2px solid #050b12;
			box-shadow: var(--hard-shadow);
		}

		.button:hover {
			background: var(--gold-bright);
		}

		.button:active {
			translate: 3px 3px;
			box-shadow: none;
		}

		.button.secondary {
			background: transparent;
			color: var(--dim);
			border-color: #2c4054;
		}

		.button.secondary:hover {
			color: var(--gold);
			border-color: var(--gold);
		}

		@media (max-width: 800px) {
			main {
				padding: 20px 18px 60px;
			}
		}
	</style>
</head>

<body>
	<header>
		<a class="brand" href="/" aria-label="Cordon Off home"><span class="mark" aria-hidden="true"></span><span
				class="brand-text">Cordon <strong>Off</strong></span></a>
		<a class="nav" href="/">Back to the game</a>
	</header>
	<main>
		<p class="status" id="status">Loading…</p>
		<section id="list" hidden></section>
		<section id="detail" hidden></section>
	</main>
	<script type="module">
		const status = document.getElementById("status");
		const list = document.getElementById("list");
		const detail = document.getElementById("detail");
		const requested = Number(new URLSearchParams(location.search).get("round"));

		const note = (text) => {
			status.hidden = false;
			status.textContent = text;
			list.hidden = true;
			detail.hidden = true;
		};
		const show = (node) => {
			status.hidden = true;
			node.hidden = false;
		};
		const element = (tag, className, text) => {
			const node = document.createElement(tag);
			if (className) node.className = className;
			if (text !== undefined) node.textContent = text;
			return node;
		};
		const swatch = (color) => {
			const span = element("span", "swatch");
			if (/^#[0-9a-f]{6}$/i.test(color ?? "")) span.style.background = color;
			return span;
		};
		const utc = (ms) =>
			`${new Date(ms).toISOString().replace("T", " ").slice(0, 16)} UTC`;
		const duration = (startedAt, endedAt) => {
			if (!startedAt) return null;
			const total = Math.max(0, Math.round((endedAt - startedAt) / 1000));
			const hours = Math.floor(total / 3600);
			const minutes = Math.floor((total % 3600) / 60);
			return hours ? `${hours}h ${minutes}m` : `${minutes}m`;
		};

		async function loadRoundResult(round, attempts = 90) {
			for (let i = 0; i < attempts; i++) {
				try {
					const response = await fetch(`./history/${round}.json`, {
						cache: "no-store",
					});
					if (response.ok) return await response.json();
					if (response.status !== 404) break;
				} catch {
					// The deploy or a transient network error; keep waiting.
				}
				note(`Publishing results for round ${round}…`);
				await new Promise((resolve) => setTimeout(resolve, 2000));
			}
			return undefined;
		}

		function renderDetail(result) {
			detail.replaceChildren();
			const eyebrow = element("p", "eyebrow", "Final result");
			const heading = element("h1", undefined, `Round ${result.number}`);
			detail.append(eyebrow, heading);
			const lines = [`Ended ${utc(result.endedAt)}`];
			const length = duration(result.startedAt, result.endedAt);
			if (length) lines.push(`Lasted ${length}`);
			lines.push(
				`${result.humans} ${result.humans === 1 ? "human" : "humans"} at the end`,
			);
			detail.append(element("p", "meta", lines.join(" · ")));

			const winner = element("div", "winner");
			if (result.winner) {
				winner.append(swatch(result.winner.color));
				winner.append(element("span", "name", result.winner.name));
				winner.append(
					element(
						"span",
						"meta",
						`won with ${result.winner.count.toLocaleString()} pixels`,
					),
				);
			} else {
				winner.append(element("span", "name", "No territory was claimed"));
			}
			detail.append(winner);

			const image = element("img", "map");
			image.src = `./history/${result.number}.png`;
			image.alt = `Map of the world at the end of round ${result.number}`;
			image.loading = "lazy";
			detail.append(image);

			const table = element("table");
			const head = element("tr");
			for (const label of ["#", "Country", "Pixels"]) {
				head.append(element("th", undefined, label));
			}
			table.append(head);
			result.countries.forEach((country, index) => {
				const row = element("tr");
				const rank = element("td", undefined, String(index + 1));
				const name = element("td");
				name.append(swatch(country.color), document.createTextNode(country.name));
				if (country.isBot) name.append(element("span", "bot", "bot"));
				const score = element("td", "score", country.count.toLocaleString());
				row.append(rank, name, score);
				table.append(row);
			});
			detail.append(table);

			const actions = element("div", "actions");
			const again = element("a", "button", "Play the next round");
			again.href = "/";
			const all = element("a", "button secondary", "All rounds");
			all.href = "/history.html";
			actions.append(again, all);
			detail.append(actions);
			document.title = `Round ${result.number} · Cordon Off`;
			show(detail);
		}

		function renderList(entries) {
			list.replaceChildren();
			list.append(element("p", "eyebrow", "The archive"));
			list.append(element("h1", undefined, "Past rounds"));
			list.append(
				element(
					"p",
					"meta",
					"Rounds end every 2 hours at even UTC hours. The last 20 results are kept.",
				),
			);
			const grid = element("div", "grid");
			for (const entry of entries) {
				const card = element("a", "card");
				card.href = `/history.html?round=${entry.number}`;
				const image = element("img");
				image.src = `./history/${entry.number}.png`;
				image.alt = `Map of round ${entry.number}`;
				image.loading = "lazy";
				const body = element("div", "body");
				body.append(element("div", "title", `Round ${entry.number}`));
				const winner = element("div", "line");
				if (entry.winner) {
					winner.append(swatch(entry.winner.color));
					winner.append(document.createTextNode(`${entry.winner.name} won`));
				} else {
					winner.textContent = "No territory claimed";
				}
				body.append(winner);
				body.append(element("div", "line", utc(entry.endedAt)));
				card.append(image, body);
				grid.append(card);
			}
			list.append(grid);
			show(list);
		}

		async function main() {
			if (requested > 0) {
				note(`Publishing results for round ${requested}…`);
				const result = await loadRoundResult(requested);
				if (!result) {
					note(
						`Results for round ${requested} are not available. It may have rotated out of the archive.`,
					);
					return;
				}
				renderDetail(result);
				return;
			}
			try {
				const response = await fetch("./history/index.json", {
					cache: "no-store",
				});
				if (!response.ok) throw new Error(String(response.status));
				const entries = await response.json();
				if (!Array.isArray(entries) || entries.length === 0) {
					note(
						"No finished rounds yet. The first results appear at the next 2-hour boundary.",
					);
					return;
				}
				renderList(entries);
			} catch {
				note("Could not load past rounds. Try again shortly.");
			}
		}

		void main();
	</script>
</body>

</html>
