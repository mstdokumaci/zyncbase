name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-macos
            os: macos-latest
            suffix: macos-aarch64
          - target: x86_64-macos
            os: macos-15-intel
            suffix: macos-x86_64
          - target: aarch64-linux-gnu
            os: ubuntu-24.04-arm
            suffix: linux-aarch64
          - target: x86_64-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build ZyncBase
        shell: bash
        run: |
          ZIG_FLAGS=(
            "build"
            "-Doptimize=ReleaseFast"
            "--prefix" "release-out"
            "--summary" "all"
          )

          if [[ "${{ matrix.target }}" == "x86_64"* ]]; then
            ZIG_FLAGS+=("-Dcpu=x86_64_v2")
          elif [[ "${{ matrix.target }}" == "aarch64"* ]]; then
            ZIG_FLAGS+=("-Dcpu=baseline")
          fi

          if [[ "${{ matrix.target }}" == *"macos"* ]]; then
            if SDK=$(xcrun --show-sdk-path 2>/dev/null); then
              ZIG_FLAGS+=("-Dsysroot=$SDK")
            fi
          fi

          zig "${ZIG_FLAGS[@]}"

      - name: Package Release
        shell: bash
        run: |
          mkdir -p dist
          cp release-out/bin/zyncbase dist/zyncbase-${{ matrix.suffix }}
          cd dist
          if [[ "${{ matrix.target }}" == *"macos"* ]]; then
            zip zyncbase-${{ matrix.suffix }}.zip zyncbase-${{ matrix.suffix }}
          else
            tar -czf zyncbase-${{ matrix.suffix }}.tar.gz zyncbase-${{ matrix.suffix }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyncbase-${{ matrix.suffix }}
          path: dist/zyncbase-${{ matrix.suffix }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
