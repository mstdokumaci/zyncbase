name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [ReleaseSafe, ReleaseFast]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run tests
        run: zig build test -Doptimize=${{ matrix.optimize }} -Dcpu=x86_64_v2 --summary all

  test-sanitized:
    name: Test with ThreadSanitizer
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run tests with ThreadSanitizer
        run: zig build test -Dsanitize=thread --summary all
        env:
          TSAN_OPTIONS: second_deadlock_stack=1:history_size=7

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript formatting and lint
        run: bunx biome check --error-on-warnings

      - name: Test TypeScript SDK
        run: bun test sdk

      - name: Build TypeScript SDK
        run: bun run --filter @zyncbase/client build

      - name: Run TypeScript E2E tests
        run: bun run test:e2e

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Install linters
        run: |
          # SHA-256 pins computed from release assets (upstreams publish no checksums).
          # Update these when bumping linter versions.
          curl -fsSL -o /tmp/zlint \
            "https://github.com/DonIsaac/zlint/releases/download/v0.9.1/zlint-linux-x86_64"
          echo "3290bd511d37e4f6ccca3621b9894cd6c378195cdaac27520d0bd894058b2b9b  /tmp/zlint" | sha256sum -c -
          chmod +x /tmp/zlint
          sudo mv /tmp/zlint /usr/local/bin/zlint

          mkdir -p /tmp/zsort
          curl -fsSL -o /tmp/zsort.tar.gz \
            "https://github.com/mstdokumaci/zsort/releases/download/v0.7.0/zsort-x86_64-linux.tar.gz"
          echo "446081c805aebd4ba8bc6f4126981bfd8875e65503d7b0d7275ab5c9566ec56a  /tmp/zsort.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zsort.tar.gz -C /tmp/zsort
          sudo mv /tmp/zsort/zsort /usr/local/bin/zsort

          mkdir -p /tmp/zwanzig
          curl -fsSL -o /tmp/zwanzig.tar.gz \
            "https://github.com/forketyfork/zwanzig/releases/download/v0.14.0/zwanzig-v0.14.0-linux-x86_64.tar.gz"
          echo "4667f5f0635b27362a4c9340aa971318f71e5aee778bd5302e88c008e5ce368d  /tmp/zwanzig.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zwanzig.tar.gz -C /tmp/zwanzig
          sudo mv /tmp/zwanzig/zwanzig /usr/local/bin/zwanzig

      - name: Run lint
        run: bun run lint

  build:
    name: Build (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        optimize: [ReleaseSafe, ReleaseFast]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }} -Dcpu=x86_64_v2
