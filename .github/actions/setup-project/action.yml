name: 'Setup ZyncBase Project'
description: 'Standard setup steps for ZyncBase project including Zig'

runs:
  using: "composite"
  steps:
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
        cache-key: ${{ matrix.optimize }}-${{ matrix.target }}
        cache-size-limit: 4096

    - name: Prepare Zig global cache
      shell: bash
      run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/zig}/tmp"

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install OpenSSL (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew list openssl || HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl

    - name: Install OpenSSL (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libssl-dev
