name: 'Setup ZyncBase Project'
description: 'Standard setup steps for ZyncBase project including Zig'

runs:
  using: "composite"
  steps:
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
        cache-key: ${{ matrix.optimize }}-${{ matrix.target }}
        cache-size-limit: 4096

    - name: Prepare Zig global cache
      shell: bash
      run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/zig}/tmp"

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
